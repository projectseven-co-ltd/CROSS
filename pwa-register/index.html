<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CROSS - Community Response Prayer System">
  <meta name="theme-color" content="#1a1a1a">
  <title>CROSS Registration</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23fff' width='180' height='180'/><text x='90' y='110' font-size='80' font-weight='bold' text-anchor='middle' fill='%23000'>✝</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23fff' width='180' height='180'/><text x='90' y='110' font-size='80' font-weight='bold' text-anchor='middle' fill='%23000'>✝</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f0f0f;
      color: #eee;
      line-height: 1.6;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
      padding-top: 20px;
      padding-bottom: 40px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 8px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 14px;
      color: #999;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #ccc;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0f0f0f;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #666;
      background: #1a1a1a;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #fff;
      color: #000;
    }

    .btn-primary:hover {
      background: #f0f0f0;
    }

    .btn-primary:disabled {
      background: #666;
      color: #999;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #333;
      color: #fff;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: #444;
    }

    .text-center {
      text-align: center;
    }

    .text-sm {
      font-size: 13px;
      color: #999;
    }

    .link {
      color: #fff;
      text-decoration: underline;
      cursor: pointer;
    }

    .link:hover {
      color: #ccc;
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .alert-error {
      background: #3d1f1f;
      color: #ffcccc;
      border: 1px solid #cc6666;
    }

    .alert-success {
      background: #1f3d2f;
      color: #ccffdd;
      border: 1px solid #66cc99;
    }

    .alert-info {
      background: #1f2d3d;
      color: #ccddff;
      border: 1px solid #6699cc;
    }

    .qr-container {
      text-align: center;
      margin: 20px 0;
    }

    #qrCode {
      max-width: 100%;
      height: auto;
      background: #fff;
      padding: 10px;
      border-radius: 8px;
    }

    .user-info {
      background: #0f0f0f;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #333;
    }

    .user-info-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }

    .user-info-item:last-child {
      border-bottom: none;
    }

    .user-info-label {
      color: #999;
    }

    .user-info-value {
      color: #fff;
      font-weight: 500;
    }

    .prayer-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .prayer-item {
      background: #0f0f0f;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 3px solid #666;
    }

    .prayer-text {
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .prayer-time {
      font-size: 12px;
      color: #999;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0f0f0f;
      color: #999;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #333;
      color: #fff;
      border-color: #555;
    }

    .divider {
      text-align: center;
      margin: 20px 0;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">✝</div>
      <h1>CROSS</h1>
      <p class="tagline">Community Response Prayer System</p>
    </header>

    <!-- Login/Signup Screen -->
    <div id="authScreen" class="screen active">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Login Form -->
      <div id="loginTab">
        <div class="card">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••">
          </div>
          <button class="btn-primary" onclick="handleLogin()">Sign In</button>
          <p class="text-sm text-center" style="margin-top: 12px;">Demo: test@cross.local / password123</p>
        </div>
      </div>

      <!-- Signup Form -->
      <div id="signupTab" style="display: none;">
        <div class="card">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="signupName" placeholder="Your name">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="signupPasswordConfirm" placeholder="••••••••">
          </div>
          <button class="btn-primary" onclick="handleSignup()">Create Account</button>
        </div>
      </div>
    </div>

    <!-- Home Screen (After Login) -->
    <div id="homeScreen" class="screen">
      <div class="card">
        <div class="form-group text-center">
          <p class="text-sm" style="margin-bottom: 12px;">Logged in as</p>
          <h2 style="font-size: 18px; margin-bottom: 4px;" id="userDisplayName"></h2>
          <p class="text-sm" id="userDisplayEmail"></p>
        </div>
        <button class="btn-secondary" onclick="goToScreen('registerCrossScreen')">Register a Cross</button>
        <button class="btn-secondary" onclick="goToScreen('prayerScreen')">Submit Prayer</button>
        <button class="btn-secondary" onclick="goToScreen('myCrossesScreen')">My Crosses</button>
        <button class="btn-secondary" style="background: #1a1a1a; margin-top: 16px;" onclick="handleLogout()">Sign Out</button>
      </div>
    </div>

    <!-- Register Cross Screen -->
    <div id="registerCrossScreen" class="screen">
      <button class="btn-secondary" style="margin-bottom: 16px;" onclick="goToScreen('homeScreen')">← Back</button>
      
      <div class="card">
        <h2 style="font-size: 20px; margin-bottom: 16px;">Register a Cross</h2>
        
        <div class="form-group">
          <label>Device Name</label>
          <input type="text" id="deviceName" placeholder="e.g., luke-3A7 (from QR code or device)">
          <p class="text-sm" style="margin-top: 4px;">Scan the QR code on the physical cross or enter the device name</p>
        </div>

        <div class="form-group">
          <label>Geographic Area</label>
          <select id="geoArea">
            <option value="">Select a geographic area...</option>
            <option value="north">North District</option>
            <option value="south">South District</option>
            <option value="east">East District</option>
            <option value="west">West District</option>
            <option value="downtown">Downtown</option>
          </select>
        </div>

        <div class="form-group">
          <label>Location Notes (Optional)</label>
          <textarea id="locationNotes" placeholder="e.g., Community Center, Main St" rows="3"></textarea>
        </div>

        <button class="btn-primary" onclick="handleRegisterCross()">Register Cross</button>
      </div>

      <div id="registrationStatus"></div>
    </div>

    <!-- My Crosses Screen -->
    <div id="myCrossesScreen" class="screen">
      <button class="btn-secondary" style="margin-bottom: 16px;" onclick="goToScreen('homeScreen')">← Back</button>
      
      <div class="card">
        <h2 style="font-size: 20px; margin-bottom: 16px;">My Crosses</h2>
        <div id="crossesList" class="prayer-list">
          <p class="text-sm text-center" style="color: #666; padding: 20px;">Loading crosses...</p>
        </div>
      </div>
    </div>

    <!-- Prayer Screen -->
    <div id="prayerScreen" class="screen">
      <button class="btn-secondary" style="margin-bottom: 16px;" onclick="goToScreen('homeScreen')">← Back</button>
      
      <div class="card">
        <h2 style="font-size: 20px; margin-bottom: 16px;">Submit a Prayer</h2>
        
        <div class="form-group">
          <label>Select a Cross</label>
          <select id="prayerCrossSelect">
            <option value="">Loading your crosses...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Prayer Request</label>
          <textarea id="prayerText" placeholder="Write your prayer request..." rows="5"></textarea>
        </div>

        <button class="btn-primary" onclick="handleSubmitPrayer()">Submit Prayer</button>
      </div>

      <div id="prayerStatus"></div>
    </div>
  </div>

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- App Script -->
  <script src="app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW registration failed'));
    }
  </script>
</body>
</html>
